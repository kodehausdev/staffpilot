version: 1.0
runtime: python311

build:
  commands:
    build:
      - pip install -r requirements.txt

run:
  runtime-version: "3.11"
  command: uvicorn main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
    env: APP_PORT
  env:
    - name: SUPABASE_URL
      value-source:
        secrets-manager:
          name: staffpilot/backend
          key: SUPABASE_URL
    - name: SUPABASE_SERVICE_ROLE_KEY
      value-source:
        secrets-manager:
          name: staffpilot/backend
          key: SUPABASE_SERVICE_ROLE_KEY
    - name: GEMINI_API_KEY
      value-source:
        secrets-manager:
          name: staffpilot/backend
          key: GEMINI_API_KEY
    - name: TOGETHER_API_KEY
      value-source:
        secrets-manager:
          name: staffpilot/backend
          key: TOGETHER_API_KEY
    - name: WHATSAPP_ACCESS_TOKEN
      value-source:
        secrets-manager:
          name: staffpilot/backend
          key: WHATSAPP_ACCESS_TOKEN
    - name: WHATSAPP_PHONE_NUMBER_ID
      value-source:
        secrets-manager:
          name: staffpilot/backend
          key: WHATSAPP_PHONE_NUMBER_ID
    - name: WHATSAPP_BUSINESS_ACCOUNT_ID
      value-source:
        secrets-manager:
          name: staffpilot/backend
          key: WHATSAPP_BUSINESS_ACCOUNT_ID
    - name: WHATSAPP_VERIFY_TOKEN
      value-source:
        secrets-manager:
          name: staffpilot/backend
          key: WHATSAPP_VERIFY_TOKEN
    - name: SECRET_KEY
      value-source:
        secrets-manager:
          name: staffpilot/backend
          key: SECRET_KEY
    - name: FRONTEND_URL
      value-source:
        secrets-manager:
          name: staffpilot/backend
          key: FRONTEND_URL
